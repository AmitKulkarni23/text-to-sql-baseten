# Weekly dependency update PRs. They never fail or block anything on main: each PR runs CI,
# and nothing deploys until it is merged. Minor and patch updates are grouped to keep the noise down.
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
